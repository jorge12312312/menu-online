<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Perú para ti — Catálogo digital de comida peruana. Entrega rápida.">
    <title>Perú para ti</title>

    <!-- Google Fonts: Inter + Playfair Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css?v=5.0">
</head>
<body>

    <!-- ─── Hero Banner ─────────────────────────────────────────────────── -->
    <header class="app-header">
        <div class="hero-banner">
            <!-- Video de fondo: coloca hero-video.mp4 en la carpeta public/ -->
            <video class="hero-video" autoplay loop muted playsinline>
                <source src="hero-video.mp4" type="video/mp4">
            </video>
            <div class="hero-overlay"></div>
            <h1 class="brand-title">Perú para ti</h1>
            <div class="header-info">Atenci&#xF3;n: Viernes, S&#xE1;bados y Domingos de 12 a 22 hs</div>
        </div>
    </header>

    <!-- ─── Sticky Category Navigation ─────────────────────────────────── -->
    <nav class="category-nav-wrapper">
        <ul class="category-nav" id="category-nav">
            <!-- Categories injected by app.js -->
        </ul>
    </nav>

    <!-- ─── Sub-categories bar (Bebidas) ───────────────────────────────── -->
    <div class="sub-categories-bar" id="sub-categories-bar" style="display:none">
        <!-- Sub-pills injected by app.js -->
    </div>

    <!-- ─── Search Bar ───────────────────────────────────────────────────── -->
    <div class="search-wrapper">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
             viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="search" id="search-input" class="search-input"
               placeholder="Buscar platillo..." autocomplete="off">
    </div>

    <!-- ─── Main Content ─────────────────────────────────────────────────── -->
    <main class="main-content" id="main-content">

        <!-- Loader -->
        <div class="loader-container" id="loader">
            <div class="spinner"></div>
            <p>Preparando recetas...</p>
        </div>

        <!-- Grid view (filtered by category) -->
        <div id="menu-grid-wrapper">
            <div class="menu-grid" id="menu-grid"></div>
        </div>

        <!-- Search results view -->
        <div id="search-results-view" style="display:none"></div>

    </main>

    <!-- ─── FAB Cart ──────────────────────────────────────────────────────── -->
    <button class="fab-cart" id="fab-cart" style="display: none;" aria-label="Ver carrito">
        <div class="fab-cart-inner">
            <div class="fab-icon-wrap">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                </svg>
                <span class="fab-badge" id="fab-badge">0</span>
            </div>
            <span class="fab-sep"></span>
            <span class="fab-total" id="fab-total">S/ 0.00</span>
        </div>
    </button>

    <!-- ─── Cart Bottom Sheet ──────────────────────────────────────────── -->
    <div class="cart-modal-overlay" id="cart-overlay"></div>
    <div class="cart-modal" id="cart-modal">
        <div class="cart-modal-header">
            <h2>Tu Pedido</h2>
            <button class="btn-close" id="btn-close-cart" aria-label="Cerrar">&times;</button>
        </div>
        <div class="cart-modal-body" id="cart-items"></div>
        <div class="cart-modal-footer">
            <div class="summary-row">
                <span>Total</span>
                <span class="summary-total" id="modal-total">S/ 0.00</span>
            </div>
            <div style="display: flex; gap: 12px; margin-top: 4px;">
                <button class="btn-primary btn-checkout-transfer" id="btn-checkout-transfer">
                    Transferencia
                </button>
                <button class="btn-primary btn-checkout-cash" id="btn-checkout-cash">
                    Efectivo
                </button>
            </div>
        </div>
    </div>

    <!-- ─── Payment Modal ─────────────────────────────────────────────── -->
    <div class="cart-modal-overlay" id="payment-overlay"></div>
    <div class="cart-modal" id="payment-modal">
        <div class="cart-modal-header">
            <h2>Abona tu pedido</h2>
            <button class="btn-close" id="btn-close-payment" aria-label="Cerrar">&times;</button>
        </div>
        <div class="cart-modal-body payment-body">
            <p class="payment-instructions">
                Transfiere el total exacto con estos datos.<br>
                Luego envíanos el comprobante por WhatsApp.
            </p>
            <div class="payment-card">
                <div class="payment-row">
                    <span class="payment-label">Titular</span>
                    <strong class="payment-value">Julia Ines Quispe Arpi</strong>
                </div>
                <div class="payment-row">
                    <span class="payment-label">Alias</span>
                    <strong class="payment-value">peru.parati</strong>
                </div>
            </div>
        </div>
        <div class="cart-modal-footer">
            <button class="btn-primary btn-whatsapp" id="btn-whatsapp">
                ✓ Ya pagué — Avisar por WhatsApp
            </button>
        </div>
    </div>

    <!-- ─── Toast Notifications ──────────────────────────────────────── -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.min.js"></script>
    <script src="app.js?v=5.0"></script>
</body>
</html>
